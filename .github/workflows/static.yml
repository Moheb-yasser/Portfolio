name: Deploy to GitHub Pages

on:
  push:
    branches: [ v2-portfolio, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'artifacts/moheb-portfolio/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install
        working-directory: artifacts/moheb-portfolio

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build project
        run: |
          pnpm build
          # Copies index.html into 404.html so GitHub Pages routes all URLs directly into your React app
          cp dist/public/index.html dist/public/404.html
        working-directory: artifacts/moheb-portfolio
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/moheb-portfolio/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
