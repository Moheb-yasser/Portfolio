<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Container background & border matching border-[#55c9ff]/60 and bg-[#55c9ff]/10 -->
  <rect 
    x="0.5" 
    y="0.5" 
    width="31" 
    height="31" 
    rx="6" 
    ry="6" 
    fill="#0a192f" 
    stroke="#55c9ff" 
    stroke-opacity="0.6" 
    stroke-width="1"
  />
  
  <!-- "MY" initials perfectly centered using dominant-baseline and text-anchor -->
  <text 
    x="16" 
    y="16" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#55c9ff" 
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="600" 
    font-size="14"
  >MY</text>
</svg>
